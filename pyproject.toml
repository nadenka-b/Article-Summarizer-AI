[project]
name = "article-summarizer-ai"
version = "0.1.0"
description = "Summarizer of scientific articles with quality assessment"
authors = [
    { name = "nadenka-b", email = "nabalabanova@mail.ru" },
    { name = "Adelina20034", email = "sat_ade@mail.ru" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "transformers (>=5.19.0,<6.0.0)",
    "sentencepiece (>=0.2.2,<0.3.0)",
    "sacrebleu (>=2.6.0,<3.0.0)",
    "bert-score (>=0.3.13,<0.4.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "nltk (>=3.10.3,<4.0.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-v --strict-markers"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.16.0,<4.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
]

[tool.poetry]
package-mode = false
