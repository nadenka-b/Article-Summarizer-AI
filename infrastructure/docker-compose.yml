# infrastructure/docker-compose.yml

services:
  # ============================================================================
  # PostgreSQL
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: summarizer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: summarizer_user
      POSTGRES_PASSWORD: summarizer_password
      POSTGRES_DB: summarizer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarizer_user -d summarizer_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - summarizer_net

  # ============================================================================
  # FastAPI app
  # ============================================================================
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: summarizer_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Переопределяем DATABASE_URL для контейнера: db — имя сервиса
      DATABASE_URL: postgresql://summarizer_user:summarizer_password@db:5432/summarizer_db
      DEBUG: "true"
      PROJECT_NAME: Article-Summarizer-AI
      # LM Studio запущен на хосте, из контейнера доступен через host.docker.internal
      LMSTUDIO_URL: http://host.docker.internal:1234/v1
      LMSTUDIO_MODEL: qwen2.5-7b-instruct
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"   # для Linux (на Windows/macOS не мешает)
    volumes:
      - ../backend:/app/backend    # для hot-reload в dev
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started

  # ============================================================================
  # Redis (брокер Celery + бэкенд результатов задач)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: summarizer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - summarizer_net

  # ============================================================================
  # Celery worker (фоновая суммаризация и переиндексация)
  # ============================================================================
  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: summarizer_worker
    restart: unless-stopped
    command: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://summarizer_user:summarizer_password@db:5432/summarizer_db
      DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      LMSTUDIO_URL: http://host.docker.internal:1234/v1
      LMSTUDIO_MODEL: qwen2.5-7b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - summarizer_net

  # ============================================================================
  # Nginx (реверс-прокси API, этап 12)
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: summarizer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - summarizer_net

  # ============================================================================
  # Qdrant (векторная БД для гибридного RAG)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: summarizer_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - summarizer_net

volumes:
  postgres_data:
  qdrant_data:

networks:
  summarizer_net:
    driver: bridge